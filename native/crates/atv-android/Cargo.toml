[package]
name = "atv-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "atv_native"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "android")'.dependencies]
atv-player = { path = "../atv-player" }
atv-auth = { path = "../atv-auth" }
atv-media = { path = "../atv-media" }
atv-update = { path = "../atv-update" }
serde_json.workspace = true
jni = "0.21.1"
getrandom-legacy = { package = "getrandom", version = "0.2.17", optional = true }
getrandom-custom = { package = "getrandom", version = "0.3.4", optional = true }

[features]
legacy-android = ["dep:getrandom-legacy", "dep:getrandom-custom"]
output-only = []
